version: '3.8'

services:
  web:
    build: ./app
    ports:
      - "3000:3000"
    volumes:
      - ./app:/usr/src/app         # Mounted volume for dev hot-reloading
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - redis

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data            # Persistent volume requirement

volumes:
  redis-data: